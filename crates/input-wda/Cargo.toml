[package]
name = "imirror-input-wda"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
performance-probe = []

[[example]]
name = "wda-tap-probe"
required-features = ["performance-probe"]

[dependencies]
imirror-coordinate-map = { path = "../coordinate-map" }
imirror-input-core = { path = "../input-core" }
thiserror.workspace = true
serde_json.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking","json"] }
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_JobObjects", "Win32_Security", "Win32_System_Performance", "Win32_System_Power"] }
[lints]
workspace = true
